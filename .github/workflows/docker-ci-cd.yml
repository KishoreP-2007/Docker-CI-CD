```yaml
name: Build and Deploy Node.js App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/simple-nodejs-web-app:latest .

      # Step 4: Push image to Docker Hub
      - name: Push Image to Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/simple-nodejs-web-app:latest

      # Step 5: Deploy to Azure VM
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Starting deployment..."

            echo "Pulling latest Docker image..."

            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/simple-nodejs-web-app:latest

            echo "Stopping old container..."

            sudo docker stop node-app || true

            echo "Removing old container..."

            sudo docker rm node-app || true

            echo "Starting new container..."

            sudo docker run -d \
              --name node-app \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/simple-nodejs-web-app:latest

            echo "Deployment commands completed!"

      # Step 6: Verify deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Checking container status..."

            sleep 5

            sudo docker ps

            echo "Testing application..."

            if ! curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Deployment verification failed!"

              sudo docker logs --tail 50 node-app

              exit 1
            fi

            echo "Application deployed successfully!"
```
